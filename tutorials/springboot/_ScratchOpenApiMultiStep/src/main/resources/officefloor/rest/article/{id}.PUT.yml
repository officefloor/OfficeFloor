validate:
  class: net.officefloor.tutorial.scratchopenapi.ValidateArticle
  govern: [ transaction ]
  next: load

load:
  class: net.officefloor.tutorial.scratchopenapi.LoadArticle
  govern: [ transaction ]
  next: apply

apply:
  class: net.officefloor.tutorial.scratchopenapi.ApplyArticle
  govern: [ transaction ]
  next: save

save:
  class: net.officefloor.tutorial.scratchopenapi.SaveArticle
  govern: [ transaction ]
  next: respond

respond:
  class: net.officefloor.tutorial.scratchopenapi.RespondWithArticle
  govern: [ transaction ]
